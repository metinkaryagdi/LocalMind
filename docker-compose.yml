version: '3.8'

services:
  # 1. Ollama SLM AI Service Container
  ollama:
    image: ollama/ollama:latest
    container_name: ${PROJECT_NAME:-localmind}-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  # 2. LocalMind .NET 9 Web API Container
  localmind-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-localmind}-api
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Ollama__BaseUrl=${OLLAMA_URL:-http://ollama:11434}
      - ConnectionStrings__DefaultConnection=Filename=/app/data/localmind_nosql.db;Connection=shared
    volumes:
      - localmind_nosql_data:/app/data
    depends_on:
      - ollama
    restart: always

volumes:
  ollama_models:
  localmind_nosql_data:
